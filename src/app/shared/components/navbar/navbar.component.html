<aside class="nav">
  <div class="nav-brand">
    <div class="brand-mark">J</div>
    <div>
      <div class="brand-name">{{ 'NAV.BRAND' | translate }}</div>
      <div class="brand-sub">{{ 'NAV.BRAND_SUB' | translate }}</div>
    </div>
  </div>

  <nav class="nav-links">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">
      <span class="nav-dot"></span> {{ 'NAV.DASHBOARD' | translate }}
    </a>
    <a routerLink="/metrics" routerLinkActive="active" class="nav-link">
      <span class="nav-dot"></span> {{ 'NAV.METRICS' | translate }}
    </a>
    <a *ngIf="canManageJourneys" routerLink="/journeys" routerLinkActive="active" class="nav-link">
      <span class="nav-dot"></span> {{ 'NAV.JOURNEYS' | translate }}
    </a>
    <a *ngIf="canManageUsers" routerLink="/admin/users" routerLinkActive="active" class="nav-link">
      <span class="nav-dot"></span> {{ 'NAV.USERS' | translate }}
    </a>
  </nav>

  <div class="nav-user">
    <div class="user-card">
      <div class="user-avatar">{{ user.name.charAt(0) }}</div>
      <div class="user-meta">
        <div class="user-name">{{ user.name }}</div>
        <span class="role-chip" [class]="'role-' + roleSlug(user.role)">{{ roleLabel }}</span>
      </div>
    </div>
    <button class="btn btn-ghost btn-sm w-full" (click)="switchLanguage()" [title]="'COMMON.LANGUAGE' | translate">
      🌐 {{ otherLanguageLabel }}
    </button>
    <button class="btn btn-ghost btn-sm w-full" (click)="logout()">{{ 'NAV.LOGOUT' | translate }}</button>
  </div>
</aside>

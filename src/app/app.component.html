<div class="d-flex flex-column flex-lg-row min-vh-100">
  <app-navbar *ngIf="auth.currentUser$ | async"></app-navbar>
  <main class="app-main flex-grow-1" [class.app-main-bare]="!(auth.currentUser$ | async)">
    <!--
      Search sits at the inline start and the bell at the inline end, so in Arabic they swap sides
      without any direction check in code.
    -->
    <header class="d-flex align-items-center gap-3 mb-3" *ngIf="auth.currentUser$ | async">
      <app-global-search></app-global-search>
      <app-notification-bell class="ms-auto"></app-notification-bell>
    </header>
    <router-outlet></router-outlet>
  </main>
</div>
<app-toast-container></app-toast-container>

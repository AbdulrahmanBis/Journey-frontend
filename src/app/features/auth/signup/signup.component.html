<div class="auth-screen">
  <section class="auth-brand">
    <div class="brand-mark lg">J</div>
    <h1>{{ 'AUTH.START_JOURNEY' | translate }}</h1>
    <p>{{ 'AUTH.SIGNUP_BRAND_SUB' | translate }}</p>

    <div class="rail-demo">
      <div class="rail-line"></div>
      <div class="rail-node current"></div>
      <div class="rail-node"></div>
      <div class="rail-node"></div>
      <div class="rail-node"></div>
      <div class="rail-node"></div>
    </div>
  </section>

  <section class="auth-panel">
    <div class="card card-pad auth-card">
      <span class="page-eyebrow">{{ 'AUTH.SIGN_UP' | translate }}</span>
      <h2 class="page-title">{{ 'AUTH.CREATE_ACCOUNT' | translate }}</h2>
      <p class="muted" style="margin-top: 6px; margin-bottom: 22px;">
        {{ 'AUTH.SIGNUP_SUB' | translate }}
      </p>

      <form (submit)="$event.preventDefault(); submit()">
        <div class="field">
          <label for="name">{{ 'AUTH.FULL_NAME' | translate }}</label>
          <input id="name" class="input" type="text" [(ngModel)]="name" name="name" [placeholder]="'AUTH.NAME_PLACEHOLDER' | translate" required />
        </div>
        <div class="field">
          <label for="email">{{ 'AUTH.EMAIL' | translate }}</label>
          <input id="email" class="input" type="email" [(ngModel)]="email" name="email" [placeholder]="'AUTH.EMAIL_PLACEHOLDER' | translate" required />
        </div>
        <div class="field">
          <label for="password">{{ 'AUTH.PASSWORD' | translate }}</label>
          <input id="password" class="input" type="password" [(ngModel)]="password" name="password" [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate" required />
        </div>
        <div class="field">
          <label for="confirm">{{ 'AUTH.CONFIRM_PASSWORD' | translate }}</label>
          <input id="confirm" class="input" type="password" [(ngModel)]="confirmPassword" name="confirm" [placeholder]="'AUTH.PASSWORD_PLACEHOLDER' | translate" required />
        </div>
        <p class="field-error" *ngIf="error">{{ error }}</p>
        <button class="btn btn-primary btn-block" type="submit" [disabled]="loading">
          {{ (loading ? 'AUTH.CREATING_ACCOUNT' : 'AUTH.CREATE_ACCOUNT_BTN') | translate }}
        </button>
      </form>

      <p class="muted" style="margin-top: 18px; font-size: 13.5px;">
        {{ 'AUTH.HAVE_ACCOUNT' | translate }} <a routerLink="/login">{{ 'AUTH.SIGN_IN' | translate }}</a>
      </p>
    </div>
  </section>
</div>

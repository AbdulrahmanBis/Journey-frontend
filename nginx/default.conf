# Journey web: the Angular app plus a reverse proxy for the API.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads go up to 200 MB (app.storage.max-file-size-bytes); leave room for the multipart wrapper.
    client_max_body_size 210m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ── API ───────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Stream large uploads and media instead of buffering them in nginx.
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # ── Caching ───────────────────────────────────────────────────────────────
    # Angular's bundles carry a content hash in the name (main-AB12CD34.js), so a new build is a
    # new URL and the old one can be cached forever.
    location ~ "-[A-Z0-9]{8}\.(js|css)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # These keep the same name across builds (the two Bootstrap themes, loaded by index.html, and
    # the translations), so browsers must revalidate them or they keep last release's copy.
    location ~ "^/(bootstrap-(ltr|rtl)\.css|assets/i18n/[a-z]+\.json)$" {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Everything else, and any client-side route, falls back to index.html, which also revalidates.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
